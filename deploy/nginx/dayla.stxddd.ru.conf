# Host nginx site for Dayla. Install:
#   sudo cp deploy/nginx/dayla.stxddd.ru.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/dayla.stxddd.ru.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dayla.stxddd.ru --redirect
# certbot adds the "listen 443 ssl" lines and the HTTP -> HTTPS redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name dayla.stxddd.ru;

    server_tokens off;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
