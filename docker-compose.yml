# Whole stack in one command:  docker compose up -d --build
# Frontend: http://localhost:3000   Backend (API, /docs, legacy HTML page): http://localhost:8000
# Backend and bot share one Postgres database. Only the backend runs migrations:
# its Alembic chain already contains every bot migration.
x-db-url: &db-url postgresql+asyncpg://${POSTGRES_USER:-focus_day}:${POSTGRES_PASSWORD:-focus_day}@db:5432/${POSTGRES_DB:-focus_day}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-focus_day}
      POSTGRES_USER: ${POSTGRES_USER:-focus_day}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focus_day}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: *db-url
      STORAGE_PATH: /app/storage
      BOT_API_TOKEN: ${BOT_API_TOKEN:-local-bot-token}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  bot:
    build: ./tg_bot
    restart: unless-stopped
    # Skip the bot's own migrations; the backend has already migrated the shared database.
    command: ["python", "-m", "bot.main"]
    env_file:
      - ./tg_bot/.env
    environment:
      DATABASE_URL: *db-url
      BACKEND_URL: http://app:8000
      BOT_API_TOKEN: ${BOT_API_TOKEN:-local-bot-token}
    depends_on:
      app:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"

volumes:
  postgres_data:
  app_storage:
